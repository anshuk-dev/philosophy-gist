name: Philosophy Gist Scheduled Flashcards (5 AM & 5 PM IST)

on:
  schedule:
    # 5:00 AM IST is 23:30 UTC (previous day)
    # 5:00 PM IST is 11:30 UTC
    - cron: '30 11,23 * * *'
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to dispatch: morning_5am, evening_5pm, or auto'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning_5am
          - evening_5pm
      count:
        description: 'Number of unique flashcard emails to send in this batch'
        required: false
        default: '4'
        type: string
      dry_run:
        description: 'Run in dry-run mode (renders archives without sending emails)'
        required: false
        default: 'false'
        type: boolean
      recipient:
        description: 'Recipient Email Address'
        required: false
        default: 'anshukumar64149@gmail.com'
        type: string

permissions:
  contents: write

jobs:
  dispatch-flashcards:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run Academic Verification & Dispatch Flashcards
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'anshu.philosophy@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ inputs.recipient || secrets.RECIPIENT_EMAIL || 'anshukumar64149@gmail.com' }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          SESSION_ARG="${{ inputs.session || 'auto' }}"
          COUNT_ARG="${{ inputs.count || '4' }}"
          python run_dispatch.py --session "$SESSION_ARG" --count "$COUNT_ARG" $FLAGS --recipient "${{ inputs.recipient || secrets.RECIPIENT_EMAIL || 'anshukumar64149@gmail.com' }}"

      - name: 💾 Commit & Push Sent State & Archives
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ content/
          git diff --staged --quiet || (git commit -m "Auto-state: Persist 4-flashcard dispatch and sent history [skip ci]" && git push)
